name: Build Discord Update

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install setuptools wheel requests PyQt6

    - name: Build Python Wheel and Source Tarball
      run: |
        python setup.py sdist bdist_wheel

    - name: Create Debian Package Structure
      run: |
        mkdir -p deb_root/DEBIAN
        mkdir -p deb_root/usr/lib/discord-update
        mkdir -p deb_root/usr/bin
        mkdir -p deb_root/usr/share/applications
        mkdir -p deb_root/usr/share/icons/hicolor/256x256/apps

        cat << 'EOF' > deb_root/DEBIAN/control
        Package: discord-update
        Version: 0.1.0
        Architecture: amd64
        Maintainer: DanKert <dankerts@proton.me>
        Depends: python3, python3-pyqt6, python3-requests
        Section: utils
        Priority: optional
        Description: Graphical utility for managing and updating Discord on Linux.
        EOF

        cp -r discord_update deb_root/usr/lib/discord-update/
        
        cp -r icon deb_root/usr/lib/discord-update/discord_update/

        if [ -f icon/logo.png ]; then
          cp icon/logo.png deb_root/usr/share/icons/hicolor/256x256/apps/discord-update.png
        fi

        cat << 'EOF' > deb_root/usr/share/applications/discord-update.desktop
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=Discord Update
        Comment=Manage and update Discord on Linux
        Exec=discord-updater
        Icon=discord-update
        Terminal=false
        Categories=Utility;System;
        EOF

        cat << 'EOF' > deb_root/usr/bin/discord-updater
        #!/bin/bash
        export PYTHONPATH="${PYTHONPATH}:/usr/lib/discord-update"
        python3 -m discord_update.main "$@"
        EOF
        
        ln -s discord-updater deb_root/usr/bin/dicsord-updater
        chmod +x deb_root/usr/bin/discord-updater

    - name: Pack DEB binary
      run: |
        mkdir -p deb_dist
        dpkg-deb --build deb_root deb_dist/discord-update_0.1.0_amd64.deb

    - name: Upload DEB Package
      uses: actions/upload-artifact@v4
      with:
        name: discord-update-deb
        path: deb_dist/*.deb

    - name: Upload Tarball Package
      uses: actions/upload-artifact@v4
      with:
        name: discord-update-tarball
        path: dist/*.tar.gz